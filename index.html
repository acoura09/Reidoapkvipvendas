<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617">
    <title>REI DO APK - PORTAL VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #020617; color: white; overflow: hidden; user-select: none; height: 100vh; }
        
        /* AURORA E BACKGROUND */
        .aurora { position: fixed; width: 400px; height: 400px; filter: blur(80px); z-index: -1; opacity: 0.4; }
        .aurora-1 { top: -100px; right: -100px; background: #22c55e; }
        .aurora-2 { bottom: -100px; left: -100px; background: #a855f7; }

        /* ANIMAÇÃO LOGOS CAINDO */
        .falling-icon { position: absolute; top: -100px; animation: fall linear infinite; pointer-events: none; z-index: -1; font-weight: 900; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        /* INTERFACE */
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .active-tab { background: linear-gradient(90deg, #22c55e, #16a34a) !important; color: #000 !important; font-weight: 900; }
        .card-promo { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .card-promo:active { transform: scale(0.95); border-color: #22c55e; }

        /* PLAYER MODAL */
        #videoModal { display: none; position: fixed; inset: 0; background: #000; z-index: 10000; flex-direction: column; }
        .player-header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #0f172a; }
        .expand-btn { background: #22c55e; color: black; padding: 8px 15px; border-radius: 10px; font-weight: 800; font-size: 12px; }

        /* SCROLL */
        ::-webkit-scrollbar { width: 0px; }
        .content-area { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
    </style>
</head>
<body>

    <audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

    <div id="bg-container" class="fixed inset-0 z-[-1] overflow-hidden"></div>
    <div class="aurora aurora-1"></div>
    <div class="aurora aurora-2"></div>

    <div id="login-screen" class="fixed inset-0 z-[1000] flex items-center justify-center p-6 bg-slate-950/98 backdrop-blur-2xl">
        <div class="max-w-sm w-full text-center space-y-8">
            <div class="text-7xl">👑</div>
            <h2 class="text-4xl font-black italic tracking-tighter">REI DO APK</h2>
            <input type="tel" id="user-phone" placeholder="(00) 00000-0000" class="w-full p-5 rounded-2xl bg-white/5 border-2 border-white/10 text-center text-xl font-bold outline-none focus:border-green-500 transition-all">
            <button onclick="checkAccess()" class="w-full bg-green-500 text-black font-black py-5 rounded-2xl uppercase tracking-widest text-lg shadow-[0_0_30px_rgba(34,197,94,0.4)]">Entrar no Reino</button>
        </div>
    </div>

    <div id="videoModal">
        <div class="player-header">
            <button onclick="closePlayer()" class="text-white font-bold">✕ FECHAR</button>
            <div class="text-green-500 font-black italic">REI DO APK</div>
            <button onclick="toggleFullScreen()" class="expand-btn">TELA CHEIA</button>
        </div>
        <div class="flex-1" id="playerWrapper">
            <div id="playerRender" class="w-full h-full"></div>
        </div>
    </div>

    <div id="app-content" class="hidden h-screen flex flex-col">
        <header class="glass p-6 text-center shrink-0">
            <h1 class="text-2xl font-black italic">👑 REI DO APK <span class="text-green-500">VIP</span></h1>
        </header>

        <nav class="flex gap-2 p-4 shrink-0 overflow-x-auto">
            <button onclick="switchTab('recargas')" id="tab-btn-recargas" class="tab-btn active-tab px-6 py-3 rounded-xl text-[10px] uppercase font-black whitespace-nowrap">Recargas & Streaming</button>
            <button onclick="switchTab('tv')" id="tab-btn-tv" class="tab-btn bg-slate-800 px-6 py-3 rounded-xl text-[10px] uppercase font-black whitespace-nowrap text-slate-400">Canais de TV</button>
            <button onclick="window.open('https://wa.me/qr/S4RPP4S2GZ5RP1')" class="bg-green-600 px-6 py-3 rounded-xl text-[10px] uppercase font-black whitespace-nowrap">Grupo VIP</button>
        </nav>

        <main class="content-area">
            <section id="tab-recargas" class="space-y-6">
                <div class="p-5 rounded-3xl bg-red-900/10 border border-red-500/30">
                    <h3 class="text-red-500 font-black mb-4 uppercase text-xs tracking-widest">🔴 CLARO PROMO</h3>
                    <div class="grid gap-2" id="claro-list"></div>
                </div>
                <div class="p-5 rounded-3xl bg-blue-900/10 border border-blue-500/30">
                    <h3 class="text-blue-500 font-black mb-4 uppercase text-xs tracking-widest">🔵 TIM PROMO</h3>
                    <div class="grid gap-2" id="tim-list"></div>
                </div>
                <div class="p-5 rounded-3xl bg-purple-900/10 border border-purple-500/30">
                    <h3 class="text-purple-500 font-black mb-4 uppercase text-xs tracking-widest">🟣 VIVO PROMO</h3>
                    <div class="grid gap-2" id="vivo-list"></div>
                </div>
                <div class="p-6 rounded-[40px] bg-slate-900/80 border border-slate-700">
                    <h3 class="text-center font-black text-yellow-500 mb-6 uppercase text-xs">👑 Streaming Premium</h3>
                    <div class="grid grid-cols-2 gap-3" id="stream-grid"></div>
                </div>
            </section>

            <section id="tab-tv" class="hidden">
                <div class="grid grid-cols-2 gap-3" id="tv-grid"></div>
            </section>
        </main>
    </div>

    <script>
        const API_WA = "19999392061"; 
        let userPhone = "";

        const db = {
            claro: [[20,11],[25,12],[30,13],[35,15],[40,17],[50,20],[60,23],[70,26],[90,33],[100,36],[120,41],[150,48]],
            tim: [[15,7],[20,9],[30,12],[40,16],[50,17],[60,25],[100,35]],
            vivo: [[15,11],[20,12],[25,13],[30,15]],
            stream: [
                {n: "Netflix", p: "3.00", i: "🍿"}, {n: "YouTube Prem.", p: "1.50", i: "📺"},
                {n: "Globoplay", p: "3.00", i: "🎬"}, {n: "HBO Max", p: "3.00", i: "🐉"},
                {n: "Paramount+", p: "3.00", i: "🏔️"}, {n: "Prime Video", p: "3.00", i: "🎬"},
                {n: "Unitv", p: "1.30", i: "⚡"}, {n: "Youcine", p: "1.30", i: "🎬"}
            ],
            canais: [
                {n: "TNT", u: "https://w2.embedtv.live/tnt"}, {n: "SBT SP", u: "https://w2.embedtv.live/sbtsp"},
                {n: "ESPN", u: "https://w2.embedtv.live/espn"}, {n: "Globo SP", u: "https://w2.embedtv.live/globosp"},
                {n: "Combate", u: "https://w2.embedtv.live/combate"}, {n: "SporTV", u: "https://w2.embedtv.live/sportv"},
                {n: "Cazé TV", u: "https://w2.embedtv.live/caze1"}, {n: "Disney+", u: "https://w2.embedtv.live/disneyplus1"},
                {n: "Premiere", u: "https://w2.embedtv.live/premiere"}, {n: "Discovery Kids", u: "https://w2.embedtv.live/discoverykids"},
                {n: "History", u: "https://w2.embedtv.live/history"}, {n: "HBO", u: "https://w2.embedtv.live/hbo"},
                {n: "Dragon Ball 24h", u: "https://w2.embedtv.live/24h_dragonball"}, {n: "Chaves 24h", u: "https://w2.embedtv.live/24h_chaves"}
            ]
        };

        function playSound() { document.getElementById('clickSound').play(); }

        function checkAccess() {
            playSound();
            const input = document.getElementById('user-phone').value;
            if(input.length >= 14) {
                userPhone = input;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-content').classList.remove('hidden');
            } else { alert("Rei, digite seu Whats primeiro!"); }
        }

        function switchTab(t) {
            playSound();
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab', 'bg-slate-800'));
            document.getElementById('tab-'+t).classList.remove('hidden');
            document.getElementById('tab-btn-'+t).classList.add('active-tab');
        }

        function openPlayer(u) {
            playSound();
            document.getElementById('playerRender').innerHTML = `<iframe src="${u}" class="w-full h-full" allowfullscreen allow="autoplay"></iframe>`;
            document.getElementById('videoModal').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('videoModal').style.display = 'none';
            document.getElementById('playerRender').innerHTML = '';
        }

        function toggleFullScreen() {
            const elem = document.getElementById('playerWrapper');
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        }

        function sendOrder(item, valor) {
            playSound();
            const pixKey = "19999392061";
            navigator.clipboard.writeText(pixKey);
            const msg = encodeURIComponent(`👑 *PEDIDO REI DO APK*\n\n👤 *Cliente:* ${userPhone}\n📦 *Produto:* ${item}\n💰 *Valor:* R$ ${valor}\n\n_Já copiei o PIX, aguardando envio do comprovante!_`);
            alert("✅ Chave PIX Copiada!");
            window.open(`https://wa.me/${API_WA}?text=${msg}`, '_blank');
        }

        function render() {
            // Recargas
            ['claro', 'tim', 'vivo'].forEach(op => {
                const list = document.getElementById(op+'-list');
                db[op].forEach(([v, p]) => {
                    list.innerHTML += `
                    <div class="card-promo flex justify-between items-center p-4 rounded-2xl mb-2">
                        <span class="font-bold">Recarga R$ ${v},00</span>
                        <button onclick="sendOrder('Recarga ${op.toUpperCase()} ${v}', '${p}')" class="bg-green-500 text-black px-4 py-2 rounded-xl font-black text-xs">Pague R$ ${p},00</button>
                    </div>`;
                });
            });
            // Streaming
            db.stream.forEach(s => {
                document.getElementById('stream-grid').innerHTML += `
                <div class="card-promo p-4 rounded-3xl text-center">
                    <div class="text-2xl mb-2">${s.i}</div>
                    <div class="text-[10px] font-black uppercase mb-3">${s.n}</div>
                    <button onclick="sendOrder('${s.n}', '${s.p}')" class="w-full bg-yellow-500 text-black py-2 rounded-xl font-black text-[10px]">R$ ${s.p}</button>
                </div>`;
            });
            // Canais
            db.canais.forEach(c => {
                document.getElementById('tv-grid').innerHTML += `
                <div onclick="openPlayer('${c.u}')" class="card-promo p-5 rounded-3xl text-center cursor-pointer">
                    <div class="text-green-500 font-black mb-2 italic">PLAY</div>
                    <div class="text-[10px] font-black uppercase">${c.n}</div>
                </div>`;
            });
        }

        function startFalling() {
            const container = document.getElementById('bg-container');
            const icons = [
                {t: 'VIVO', c: '#a855f7'}, {t: 'CLARO', c: '#ef4444'}, {t: 'TIM', c: '#3b82f6'},
                {t: 'NETFLIX', c: '#e50914'}, {t: 'HBO', c: '#ffffff'}, {t: 'KING', c: '#eab308'}
            ];
            setInterval(() => {
                const icon = icons[Math.floor(Math.random()*icons.length)];
                const el = document.createElement('div');
                el.className = 'falling-icon';
                el.style.left = Math.random() * 100 + 'vw';
                el.style.color = icon.c;
                el.style.fontSize = (Math.random() * 15 + 10) + 'px';
                el.style.animationDuration = (Math.random() * 5 + 5) + 's';
                el.innerText = icon.t;
                container.appendChild(el);
                setTimeout(() => el.remove(), 10000);
            }, 500);
        }

        render(); startFalling();
    </script>
</body>
</html>
