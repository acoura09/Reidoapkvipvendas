<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>REI DO APK - O IMPÉRIO</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: white; overflow-x: hidden; }
        
        /* CHUVA DE ÍCONES NO FUNDO */
        .chuva-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; overflow: hidden; }
        .icon-drop { position: absolute; top: -100px; animation: drop linear infinite; z-index: -1; opacity: 0.4; }
        .icon-img { width: 35px; height: 35px; border-radius: 8px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); }
        @keyframes drop { to { transform: translateY(115vh) rotate(360deg); } }

        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(25px); border-bottom: 2px solid #fbbf24; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .btn-glow { transition: all 0.3s ease; box-shadow: 0 0 15px rgba(251, 191, 36, 0.2); }
        .btn-glow:active { transform: scale(0.95); filter: brightness(1.2); }
        
        .card-grad { background: linear-gradient(145deg, #0f172a, #1e293b); border: 1px solid rgba(255,255,255,0.1); border-radius: 1.5rem; }
        .item-logo { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); }

        /* Terminal Hacker para Contas Doadas */
        .account-terminal { background: #000; border: 1px solid #1e293b; font-family: 'Courier New', monospace; color: #10b981; padding: 15px; border-radius: 1rem; font-size: 11px; max-height: 250px; overflow-y: auto; white-space: pre-wrap; margin-bottom: 15px; box-shadow: inset 0 0 20px rgba(16, 185, 129, 0.1); }

        /* Brilho da Coroa Principal */
        .crown-glow { filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.6)); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    </style>
</head>
<body class="antialiased pb-24">

    <audio id="snd-success" src="https://www.soundjay.com/buttons/sounds/button-09.mp3"></audio>

    <div class="chuva-container" id="chuva"></div>

    <header class="sticky top-0 z-50 glass px-5 py-4 flex justify-between items-center">
        <h1 class="text-xl font-black italic text-yellow-500 tracking-tighter">👑 REI DO APK</h1>
        <button onclick="openAdmin()" class="bg-yellow-500 text-black px-4 py-1 rounded-full text-[10px] font-black uppercase shadow-lg hover:scale-105 transition-all">PAINEL ADM</button>
    </header>

    <main class="max-w-md mx-auto px-4 mt-6 relative z-10">
        
        <div id="step-1" class="tab-content active bg-slate-900/90 rounded-[3rem] p-8 border border-slate-700 text-center shadow-2xl">
            <div class="mb-6">
                <img src="https://i.supaimg.com/526e0837-2788-405e-8a89-9852eb7a259a/1ff1f34c-e087-40e9-9f4b-79fe0f90e5a4.png" class="w-24 h-24 mx-auto crown-glow" alt="Coroa">
            </div>
            <h2 class="text-3xl font-black mb-1 uppercase italic text-yellow-500">O IMPÉRIO</h2>
            <p class="text-slate-400 text-[10px] mb-8 font-bold uppercase tracking-widest">Recargas & Streaming</p>
            
            <div class="space-y-4">
                <input type="tel" id="user-phone" placeholder="(00) 00000-0000" class="w-full p-4 rounded-2xl text-center text-xl font-black bg-slate-800 border-2 border-transparent focus:border-yellow-500 outline-none transition-all" oninput="handlePhoneInput(this)">
                <div id="detected-op" class="text-[10px] font-black text-yellow-500 hidden bg-yellow-500/10 py-2 rounded-full border border-yellow-500/20 uppercase tracking-tighter">Detectando...</div>
                <button onclick="accessCatalog()" class="w-full bg-yellow-500 text-black font-black py-4 rounded-2xl shadow-lg uppercase btn-glow text-lg">ENTRAR NO TRONO</button>
            </div>
        </div>

        <div id="step-2" class="tab-content space-y-8">
            
            <div id="donations-area" class="hidden">
                <h3 class="text-xs font-black text-green-500 uppercase tracking-widest ml-2 mb-2 flex items-center gap-2">
                    <span class="animate-pulse inline-flex h-2 w-2 rounded-full bg-green-400"></span>
                    💎  CONTAS GRATUITAS
                </h3>
                <div class="account-terminal" id="donation-display"></div>
                <button onclick="copyDonation()" class="w-full bg-green-600/20 text-green-400 border border-green-600/50 font-black py-3 rounded-xl text-xs uppercase mb-6 active:scale-95 transition-all">COPIAR CONTEÚDO DO ACERVO</button>
            </div>

            <div id="catalog-container" class="space-y-6"></div>

            <div class="text-center pb-10">
                <button onclick="location.reload()" class="text-slate-500 font-bold uppercase text-[10px] tracking-widest hover:text-white transition-all">Sair do Sistema Imperial</button>
            </div>
        </div>

        <div id="step-admin" class="tab-content">
            <div class="bg-slate-900 p-6 rounded-3xl border-2 border-yellow-500 space-y-4">
                <h2 class="font-black text-yellow-500 uppercase italic flex items-center gap-2">
                    <img src="https://cdn-icons-png.flaticon.com/512/1042/1042390.png" class="w-6 h-6"> 
                    Gestão do Trono
                </h2>
                <p class="text-[10px] text-slate-400">Insira contas ou cookies abaixo para atualizar o app instantaneamente:</p>
                <textarea id="adm-donate-input" rows="10" class="w-full p-3 rounded-xl bg-slate-800 text-[10px] font-mono text-green-400 border border-slate-700 outline-none focus:border-yellow-500 transition-all" placeholder="Cole aqui..."></textarea>
                <button onclick="saveDonationADM()" class="w-full bg-yellow-500 text-black font-black py-4 rounded-xl text-xs uppercase shadow-lg active:scale-95 transition-all">ATUALIZAR ACERVO AGORA</button>
                <button onclick="switchTab('step-2')" class="w-full bg-slate-700 text-white font-black py-3 rounded-xl text-xs uppercase tracking-widest">Voltar ao App</button>
            </div>
        </div>
    </main>

    <script>
        const COROA = "https://cdn-icons-png.flaticon.com/512/1042/1042390.png";
        const LOGOS = {
            VIVO: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSUAsBYpujcGpqojHKsBoeWD7Q9BsaUDRNb5uYiubYCrQ&s=10",
            CLARO: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSff4MiWlxsYB2kgqDurkAgMNdCKD_WcnWG9ACo7pSt5A&s=10",
            TIM: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRKneg6rqD3sfqHA9OF1i0z4Br1bGaqOPDiotIMw_yivA&s=10",
            NETFLIX: "https://cdn-icons-png.flaticon.com/512/5977/5977590.png",
            YOUTUBE: "https://cdn-icons-png.flaticon.com/512/1384/1384060.png",
            GLOBOPLAY: "https://s3.glbimg.com/v1/AUTH_c7def7ff66fe4b13beac0810ffbf780f/secure/home-share-89b46e5.png",
            HBOMAX: "https://www.claro.com.br/files/104379/1200x800/f803e5827f/opengraph-pagina-hbo-max.png",
            PRIME: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQeHCAtyDqNDnXqhEoWEINfxhy2UcrPZTmRaROTp_hubA&s=10",
            APPLE: "https://deadline.com/wp-content/uploads/2025/11/apple-tv-rebrand-logo-finneas.jpg?w=1024"
        };

        const DATABASE = [
            { title: "✅ VIVO - RECARGAS COM DESCONTO", type: "price", op: "VIVO", items: [
                {name: "Recarga R$ 15,00", pay: "11,00", icon: LOGOS.VIVO},
                {name: "Recarga R$ 20,00", pay: "12,00", icon: LOGOS.VIVO},
                {name: "Recarga R$ 25,00", pay: "13,00", icon: LOGOS.VIVO},
                {name: "Recarga R$ 30,00", pay: "15,00", icon: LOGOS.VIVO}
            ]},
            { title: "📱 CLARO - RECARGAS COM DESCONTO", type: "price", op: "CLARO", items: [
                {name: "Recarga R$ 20,00", pay: "11,00", icon: LOGOS.CLARO},
                {name: "Recarga R$ 30,00", pay: "13,00", icon: LOGOS.CLARO},
                {name: "Recarga R$ 50,00", pay: "20,00", icon: LOGOS.CLARO},
                {name: "Recarga R$ 100,00", pay: "36,00", icon: LOGOS.CLARO}
            ]},
            { title: "📱 TIM - RECARGAS COM DESCONTO", type: "price", op: "TIM", items: [
                {name: "Recarga R$ 15,00", pay: "7,00", icon: LOGOS.TIM},
                {name: "Recarga R$ 30,00", pay: "12,00", icon: LOGOS.TIM},
                {name: "Recarga R$ 50,00", pay: "17,00", icon: LOGOS.TIM}
            ]},
            { title: "👑 REI DO APK - STREAMING MENSAL", type: "price", items: [
                {name: "🍿 Netflix", pay: "3,00", duration: "Premium", icon: LOGOS.NETFLIX},
                {name: "📺 YouTube Premium", pay: "3,00", duration: "Mensal", icon: LOGOS.YOUTUBE},
                {name: "📺 Globoplay", pay: "3,00", duration: "Mensal", icon: LOGOS.GLOBOPLAY},
                {name: "🐉 HBO Max", pay: "3,00", duration: "Mensal", icon: LOGOS.HBOMAX},
                {name: "🎬 Prime Video", pay: "3,00", duration: "7 Dias", icon: LOGOS.PRIME},
                {name: "⚡ Unitv", pay: "1,30", duration: "8 Dias", icon: COROA}
            ]},
            { title: "📺 CANAIS DE TV AO VIVO (FREE)", type: "tv", items: [
                {name: "SPORTV 2 HD", link: "https://canaisembed.70noticias.com.br/player.php?id=sportv2", icon: COROA},
                {name: "SPORTV 3 HD", link: "https://canaisembed.70noticias.com.br/player.php?id=sportv3", icon: COROA},
                {name: "TNT 1 HD", link: "https://canaisembed.70noticias.com.br/player.php?id=tnt1", icon: COROA}
            ]}
        ];

        let detectedOp = "";

        // Carrega dados iniciais do LocalStorage
        if(!localStorage.getItem('rei_contas')) {
            localStorage.setItem('rei_contas', '--- SEM DOAÇÕES NO MOMENTO ---');
        }

        function handlePhoneInput(el) {
            let v = el.value.replace(/\D/g, "").replace(/^(\d{2})(\d)/g, "($1) $2").replace(/(\d)(\d{4})$/, "$1-$2");
            el.value = v;
            const pure = v.replace(/\D/g, "");
            if (pure.length >= 3) {
                const f = pure.substring(2, 3);
                detectedOp = (f == "9" || f == "8") ? "VIVO" : (f == "7" || f == "6") ? "TIM" : "CLARO";
                document.getElementById('detected-op').innerText = `Linha ${detectedOp} Detectada ✅`;
                document.getElementById('detected-op').classList.remove('hidden');
            }
        }

        function accessCatalog() {
            const phone = document.getElementById('user-phone').value;
            if (phone.length < 14) return alert("Por favor, digite seu número completo!");
            
            document.getElementById('snd-success').play();
            
            // Atualiza o display de doações
            const contas = localStorage.getItem('rei_contas');
            document.getElementById('donation-display').innerText = contas;
            document.getElementById('donations-area').classList.remove('hidden');
            
            renderCatalog();
            switchTab('step-2');
        }

        function renderCatalog() {
            const container = document.getElementById('catalog-container');
            container.innerHTML = "";
            DATABASE.forEach(sec => {
                if (sec.op && sec.op !== detectedOp) return;

                let html = `<div class="space-y-3"><h3 class="text-[10px] font-black text-yellow-500 uppercase tracking-widest ml-2">${sec.title}</h3><div class="card-grad overflow-hidden divide-y divide-white/5">`;
                
                sec.items.forEach(item => {
                    const isPrice = sec.type === 'price';
                    let btnText = isPrice ? `R$ ${item.pay}` : 'ASSISTIR';
                    let action = isPrice ? `order('${sec.title}', '${item.name}', '${item.pay}')` : `window.open('${item.link}', '_blank')`;
                    
                    html += `<div class="flex justify-between p-4 items-center hover:bg-white/5 transition-all">
                                <div class="flex items-center gap-3">
                                    <img src="${item.icon}" class="item-logo">
                                    <div>
                                        <p class="text-xs font-black uppercase">${item.name}</p>
                                        ${item.duration ? `<p class="text-[9px] text-slate-500 font-bold">${item.duration}</p>` : ''}
                                    </div>
                                </div>
                                <button onclick="${action}" class="bg-yellow-500 text-black px-4 py-2 rounded-xl font-black text-[10px] btn-glow shadow-md">
                                    ${btnText}
                                </button>
                             </div>`;
                });
                container.innerHTML += html + `</div></div>`;
            });
        }

        function saveDonationADM() {
            const val = document.getElementById('adm-donate-input').value;
            localStorage.setItem('rei_contas', val);
            alert("TRONO ATUALIZADO! O acervo foi alterado com sucesso.");
        }

        function copyDonation() {
            const text = document.getElementById('donation-display').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("CONTEÚDO COPIADO! Aproveite seus acessos.");
            });
        }

        function order(cat, item, valor) {
            const msg = `👑 *PEDIDO REI DO APK*\n\n✅ *PRODUTO:* ${item}\n📂 *SETOR:* ${cat}\n📱 *CLIENTE:* ${document.getElementById('user-phone').value}\n💵 *VALOR:* R$ ${valor}`;
            window.open(`https://wa.me/5519999392061?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
        }

        function openAdmin() {
            const pass = prompt("SENHA DE ACESSO AO TRONO:");
            if (pass === "3433") {
                document.getElementById('adm-donate-input').value = localStorage.getItem('rei_contas');
                switchTab('step-admin');
            } else if (pass !== null) {
                alert("Acesso Negado, Plebeu!");
            }
        }

        // Animação da Chuva de Ícones
        function createIcon() {
            const pool = [COROA, LOGOS.NETFLIX, LOGOS.CLARO, LOGOS.VIVO, LOGOS.TIM, LOGOS.YOUTUBE, LOGOS.HBO];
            const drop = document.createElement('div');
            drop.className = 'icon-drop';
            const img = document.createElement('img');
            img.src = pool[Math.floor(Math.random() * pool.length)];
            img.className = 'icon-img';
            drop.appendChild(img);
            drop.style.left = Math.random() * 100 + 'vw';
            drop.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.getElementById('chuva').appendChild(drop);
            setTimeout(() => drop.remove(), 5000);
        }
        setInterval(createIcon, 250);
    </script>
</body>
</html>
