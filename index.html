            background-color: #020617;

        }

        .area-animada {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            overflow: hidden;
        }

        .floating-logo {
            position: absolute;
            top: -100px;
            animation: fall linear infinite;
            opacity: 0.5;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }

        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .active-category { background-color: #22c55e !important; color: #000 !important; font-weight: 800; }
        
        #videoModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            flex-direction: column;
        }

        .marquee-container {
            width: 100%;
            background: #22c55e;
            color: #000;
            font-weight: 900;
            padding: 8px 0;
            text-transform: uppercase;
            overflow: hidden;
        }

        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 20s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }

        .btn-whatsapp-float {
            position: fixed;
            bottom: 25px; right: 20px;
            background: #25d366;
            width: 60px; height: 60px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;

        .canal-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

        .canal-card:active { transform: scale(0.95); background: #22c55e; }
        .canal-card:active .play-icon { color: #000; }
        .canal-card:active .canal-name { color: #000; }

        .input-login {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            transition: border-color 0.3s;

        function maskPhone(i) {
            let v = i.value.replace(/\D/g, "");
            v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
            v = v.replace(/(\d)(\d{4})$/, "$1-$2");
            i.value = v;
        }

        function checkAccess() {
            const phone = document.getElementById('user-phone').value;
            if(phone.length >= 14) {
                USER_PHONE = phone;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                document.getElementById('float-wa').style.display = 'flex';
            } else {
                alert("Digite seu WhatsApp para entrar.");
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-category', 'bg-slate-800'));
            document.getElementById('tab-' + tab).classList.remove('hidden');
            document.getElementById('btn-' + tab).classList.add('active-category');
            if(tab === 'recharges') document.getElementById('btn-tv').classList.add('bg-slate-800');
            else document.getElementById('btn-recharges').classList.add('bg-slate-800');
        }

        function openPlayer(url) {
            document.getElementById('playerRender').innerHTML = `<iframe src="${url}" class="w-full h-full" allowfullscreen allow="autoplay; fullscreen"></iframe>`;
            document.getElementById('videoModal').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('videoModal').style.display = 'none';
            document.getElementById('playerRender').innerHTML = '';
        }

        function render() {
            ['vivo', 'claro', 'tim'].forEach(op => {
                const list = document.getElementById(op + '-list');
                data[op].forEach(([v, p]) => {
                    list.innerHTML += `
                        <div class="flex justify-between items-center bg-slate-900/60 p-4 rounded-2xl border border-white/5">
                            <span class="font-bold text-sm">Recarga R$ ${v},00</span>
                            <button onclick="sendOrder('${p}', 'Recarga ${op.toUpperCase()} ${v}')" class="bg-green-500 text-black px-4 py-2 rounded-xl font-black italic shadow-lg">R$ ${p},00 🔥</button>
                        </div>`;
                });
            });

            const sGrid = document.getElementById('streaming-grid');
            data.streaming.forEach(s => {
                sGrid.innerHTML += `
                    <div class="bg-slate-800/40 p-5 rounded-[35px] text-center border border-white/5">
                        <div class="text-3xl mb-1">${s.i}</div>
                        <div class="text-[11px] font-black uppercase text-white mb-2">${s.n}</div>
                        <button onclick="sendOrder('${s.p}', '${s.n}')" class="w-full bg-yellow-500 text-black text-[10px] font-black py-3 rounded-2xl uppercase">R$ ${s.p}</button>
                    </div>`;
            });

            const tvGrid = document.getElementById('tv-grid');
            data.tv.forEach(ch => {
                tvGrid.innerHTML += `
                    <div onclick="openPlayer('${ch.l}')" class="canal-card p-4 rounded-[25px] text-center cursor-pointer relative overflow-hidden group">
                        <div class="play-icon text-green-500 text-2xl mb-2 group-hover:scale-125 transition-transform duration-300">▶</div>
                        <div class="canal-name text-[9px] font-extrabold uppercase text-slate-300 leading-tight">${ch.n}</div>
                    </div>`;
            });
        }

        function sendOrder(val, item) {
            const pixKey = "19999392061";
            navigator.clipboard.writeText(pixKey);
            const msg = encodeURIComponent(`👑 *NOVO PEDIDO - REI DO APK*\n\n👤 *Cliente:* ${USER_PHONE}\n📦 *Produto:* ${item}\n💰 *Valor:* R$ ${val}\n\n_Já copiei a chave PIX, enviando comprovante!_`);
            alert(`✅ Chave PIX Copiada!\n\nValor: R$ ${val}\nItem: ${item}`);
            window.open(`https://wa.me/19999392061?text=${msg}`, '_blank');
        }

        function initBg() {

            const icons = ['📱', '🍿', '👑', '📺', '🎬', '📡', '🔥', '✅', '💰'];

                el.className = 'floating-logo';
                el.innerText = icons[Math.floor(Math.random()*icons.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.fontSize = (Math.random() * 20 + 20) + 'px';
                el.style.animationDuration = (Math.random() * 10 + 10) + 's';
                el.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(el);
            }
